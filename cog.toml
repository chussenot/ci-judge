# cocogitto (https://docs.cocogitto.io): every commit is a Conventional
# Commit, the version comes from them, and `cog bump --auto` makes the tag
# that .github/workflows/release.yml builds. CHANGELOG.md is Keep a
# Changelog written by hand, so no section is generated after a `- - -`
# separator; `mise run release:check` refuses a version without its
# section (a failing first hook here makes cog panic on an empty stash).
tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true
disable_changelog = true
pre_bump_hooks = [
  "cargo set-version {{version}} 2>/dev/null || sed -i.bak 's/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml && rm -f Cargo.toml.bak",
  "cargo check --quiet",
  "git add Cargo.toml Cargo.lock",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "ci-judge"
owner = "chussenot"
authors = [{ signature = "Clément Hussenot", username = "chussenot" }]
