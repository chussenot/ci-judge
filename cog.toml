# cocogitto (https://docs.cocogitto.io): every commit is a Conventional
# Commit, the version comes from them, and `cog bump --auto` makes the tag
# that .github/workflows/release.yml builds. CHANGELOG.md is Keep a
# Changelog written by hand: head its section with the version before the
# bump, which refuses without it (the first hook) rather than writing its
# own section after a `- - -` separator.
tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true
disable_changelog = true
pre_bump_hooks = [
  "grep -qF '## [{{version}}] ' CHANGELOG.md",
  "cargo set-version {{version}} 2>/dev/null || sed -i.bak 's/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",
  "cargo check --quiet",
  "git add Cargo.toml Cargo.lock",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "ci-judge"
owner = "chussenot"
authors = [{ signature = "Clément Hussenot", username = "chussenot" }]
