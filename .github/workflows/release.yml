name: release

# Builds the static `ci-judge` binaries, publishes them as a GitHub release
# with checksums, and pushes the container image to ghcr.io, from a pushed
# `v*` tag (`cog bump --auto` makes one; mise.toml, task `release`).
#
# A `workflow_dispatch` is a dry run: the binaries are built, the image is
# built and run, and nothing is published or pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: the CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary runs
        run: |
          ./target/${{ matrix.target }}/release/ci-judge --version
          ./target/${{ matrix.target }}/release/ci-judge check
      - name: Package
        run: |
          set -eu
          out=ci-judge-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/ci-judge "$out"
          if command -v sha256sum >/dev/null; then sha256sum "$out" > "$out.sha256"; else shasum -a 256 "$out" > "$out.sha256"; fi
          cat "$out.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-judge-${{ matrix.target }}
          path: |
            ci-judge-${{ matrix.target }}
            ci-judge-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: the GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist && cat dist/*.sha256
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/ci-judge-*-*
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  image:
    name: the container image to ghcr.io
    needs: [build, publish]
    # After a publish on a tag; on a dry run the image is built from the
    # dry-run binaries, run, and not pushed.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write      # ghcr.io/chussenot/ci-judge
      id-token: write      # the attestation
      attestations: write  # build provenance on the image
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ci-judge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The build context, from the release binaries
        run: scripts/image-context.sh --dist dist
      - name: The version
        id: tags
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dry-run.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          load: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.title=ci-judge
            org.opencontainers.image.description=Merge-request evidence to a calibrated verdict file for a CI gate
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - name: Push the minor and latest tags
        if: github.event_name == 'push'
        run: |
          set -eu
          version="${{ steps.tags.outputs.version }}"
          minor="${version%.*}"
          docker buildx imagetools create "$IMAGE:$version" --tag "$IMAGE:$minor" --tag "$IMAGE:latest"
      - name: The image runs with no shell, as 65532
        run: |
          set -eu
          docker buildx build --load --platform linux/amd64 -t "$IMAGE:test" .
          docker run --rm "$IMAGE:test" --version
          docker run --rm "$IMAGE:test" catalog
          docker run --rm -v "$PWD/rubrics:/work:ro" "$IMAGE:test" check infra-plan
          uid="$(docker inspect "$IMAGE:test" --format '{{.Config.User}}')"
          [ "$uid" = "65532:65532" ] || { echo "runs as $uid, not 65532:65532"; exit 1; }
      - name: Attest the provenance of the pushed image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
