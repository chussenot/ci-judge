name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - name: The bundled rubrics, manifests and cases read together
        run: cargo run --quiet -- check

  deny:
    name: licences, advisories, bans, sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.0"
          command: check advisories licenses bans sources

  msrv:
    name: builds on rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  musl:
    name: static binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: The binary runs with no dynamic dependency
        run: |
          file target/x86_64-unknown-linux-musl/release/ci-judge
          ./target/x86_64-unknown-linux-musl/release/ci-judge --version
          ./target/x86_64-unknown-linux-musl/release/ci-judge catalog
      - name: The image context fills from a local build
        run: scripts/image-context.sh --local && ls -l bin/linux/amd64/ci-judge image/
      - uses: actions/upload-artifact@v4
        with:
          name: ci-judge-x86_64-unknown-linux-musl-dev
          path: target/x86_64-unknown-linux-musl/release/ci-judge

  # The judge judging its own pull requests, with no key: every request is
  # shaped and printed, nothing is asked.
  dogfood:
    name: explain on this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -- explain --rubric mr-hygiene | head -c 20000
