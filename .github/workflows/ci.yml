name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - name: The bundled rubrics, manifests and cases read together
        run: cargo run --quiet -- check

  deny:
    name: licences, advisories, bans, sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.0"
          command: check advisories licenses bans sources

  msrv:
    name: builds on rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  musl:
    name: static binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: The binary runs with no dynamic dependency
        run: |
          file target/x86_64-unknown-linux-musl/release/ci-judge
          ./target/x86_64-unknown-linux-musl/release/ci-judge --version
          ./target/x86_64-unknown-linux-musl/release/ci-judge catalog
      - name: The image context fills from a local build
        run: scripts/image-context.sh --local && ls -l bin/linux/amd64/ci-judge image/
      - uses: actions/upload-artifact@v4
        with:
          name: ci-judge-x86_64-unknown-linux-musl-dev
          path: target/x86_64-unknown-linux-musl/release/ci-judge

  hooks:
    name: pre-commit hooks (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Install prek
        run: |
          curl -fsSL https://github.com/j178/prek/releases/download/v0.5.5/prek-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
          prek --version
      # The cargo hooks already run in the check job; the commit-msg hook
      # runs in the commits job, over the pull request's commits.
      - name: Run hooks on all files
        run: prek run --all-files --hook-stage pre-commit
        env:
          SKIP: cargo-fmt,cargo-clippy

  commits:
    name: conventional commits (cog check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cocogitto
        run: |
          curl -fsSL https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          install -m 755 "$(find /tmp -name cog -type f | head -1)" /usr/local/bin/cog
          cog --version
      - name: Every commit of this pull request is a Conventional Commit
        run: cog check --ignore-merge-commits "origin/${{ github.base_ref }}..HEAD"

  # The judge judging its own pull requests, with no key: every request is
  # shaped and printed, nothing is asked.
  dogfood:
    name: explain on this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -- explain --rubric mr-hygiene | head -c 20000
