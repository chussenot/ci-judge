[package]
name = "ci-judge"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "Turn merge-request evidence into a calibrated verdict file for a CI gate, with the judgment crate and .jud rubrics"
license = "MIT"
repository = "https://github.com/chussenot/ci-judge"
keywords = ["ci", "gitlab", "github-actions", "judgment", "jud"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [".github/", "tests/fixtures/"]

[[bin]]
name = "ci-judge"
path = "src/main.rs"

[lib]
name = "ci_judge"
path = "src/lib.rs"

[dependencies]
judgment = { version = "0.16", features = ["jud"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
regex = "1"
globset = "0.4"
sha2 = "0.11"
roxmltree = "0.21"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
